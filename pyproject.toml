[project]
name = "ec2bedrock-cli"
version = "0.6.0"
description = "Agent and CLI to manage EC2 instances running self-hosted LLM inference: warm up an instance and serve an LLM, then hibernate it on idle to power ongoing inference workloads such as ADLC. Built on ec2-cli for the underlying EC2 machine lifecycle."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
# ec2-cli supplies the boto3-free per-machine cost arithmetic (ec2.aws.pricing).
# Its base install is dependency-free — boto3 is ec2-cli's optional [aws] extra,
# which milestone 1 never installs or imports. Pinned >=0.5 (the released line on
# PyPI); the _ec2cli adapter normalises the Estimate shape across 0.5.x/0.6.x.
dependencies = ["ec2-cli>=0.5"]

[project.urls]
Homepage = "https://github.com/agentculture/ec2bedrock-cli"
Issues = "https://github.com/agentculture/ec2bedrock-cli/issues"

[project.scripts]
ec2bedrock = "ec2bedrock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ec2bedrock"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
]

[tool.coverage.run]
source = ["ec2bedrock"]
omit = ["ec2bedrock/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=ec2bedrock (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ec2bedrock"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
